<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Second Brain Capture</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Header: Title + Toggle -->
  <div class="header">
    <h1>Second Brain</h1>
    <div class="toggle-container">
      <span class="toggle-label" id="toggleLabel">Pause capture</span>
      <label class="toggle-switch">
        <input type="checkbox" id="pauseToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Pause Banner (hidden by default) -->
  <div class="pause-banner" id="pauseBanner">
    <span class="pause-badge">Paused</span>
    <span class="pause-text">Capture paused</span>
  </div>

  <!-- Stats Section -->
  <div class="stats" id="statsSection">
    <div class="stat">
      <div class="stat-number" id="todayCount">0</div>
      <div class="stat-label">Pages today</div>
    </div>
    <div class="stat">
      <div class="stat-number" id="lastCapture">—</div>
      <div class="stat-label">Last capture</div>
    </div>
  </div>

  <!-- Empty State (hidden by default) -->
  <div class="empty-state" id="emptyState">
    <h2>No captures yet</h2>
    <p>Browse the web — visits will appear here automatically</p>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn-save" id="saveButton">
      ⭐ Save this page
    </button>
    <button class="btn-block" id="blockButton" disabled>
      Skip this domain: loading...
    </button>
    <a class="link-edit" id="editLink" href="#">Edit skipped sites</a>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="./main.ts" type="module"></script>
</body>
</html>
